version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: stock_intel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockintel
      POSTGRES_PASSWORD: stockintel
      POSTGRES_DB: stockintel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: stock_intel_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stockintel:stockintel@db:5432/stockintel
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: stock_intel_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
